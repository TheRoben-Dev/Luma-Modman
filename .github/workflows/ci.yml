name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  dotnet:
    name: .NET build and tests (core, host, CLI)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Workflow files and scripts are valid
        run: |
          python3 -c "import sys, yaml; [yaml.safe_load(open(f)) for f in sys.argv[1:]]" .github/workflows/*.yml
          bash -n tools/smoke/*.sh tools/release/*.sh
      - name: Build (warnings are errors)
        run: dotnet build Luma.sln -c Release
      - name: Test
        run: dotnet test Luma.sln -c Release --no-build --logger "console;verbosity=normal"
      - name: CLI runs
        run: dotnet src/Luma.Cli/bin/Release/net8.0/luma.dll version

  app:
    name: Godot app (import, UI smoke test, Linux and Windows export)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache Godot editor and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-mono-${{ env.GODOT_VERSION }}

      - name: Download Godot .NET ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-dl && cd ~/godot-dl
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSL --retry 3 -o editor.zip "$base/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          curl -fsSL --retry 3 -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          curl -fsSL --retry 3 -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          grep -E " (Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip|Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz)$" SHA512-SUMS.txt \
            | sed -e "s/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip/editor.zip/" -e "s/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz/templates.tpz/" \
            | sha512sum -c -

      - name: Install Godot
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglu1-mesa
          cd ~/godot-dl
          unzip -q -o editor.zip -d editor
          echo "GODOT=$(ls ~/godot-dl/editor/*/Godot_v*_mono_linux.x86_64)" >> "$GITHUB_ENV"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          mkdir -p "$dest"
          unzip -q -o -j templates.tpz 'templates/linux_*x86_64*' 'templates/windows_*x86_64*' 'templates/version.txt' -d "$dest"

      - name: Build
        run: |
          dotnet build Luma.sln -c Release
          dotnet build src/Luma.App -c Debug   # what the editor runs from source

      - name: Import project
        working-directory: src/Luma.App
        run: timeout 300 "$GODOT" --headless --import

      - name: UI smoke test (editor, from source)
        run: tools/smoke/run-ui-smoke.sh "$GODOT" "${{ runner.temp }}/shots-editor"

      - name: Export Linux build
        working-directory: src/Luma.App
        run: |
          mkdir -p ../../build/godot
          timeout 600 "$GODOT" --headless --export-release Linux ../../build/godot/Luma.x86_64 2>&1 | tee export.log
          test -x ../../build/godot/Luma.x86_64
          ! grep -E "^ERROR" export.log

      - name: Headless CLI (luma)
        run: |
          dotnet publish src/Luma.Cli -c Release -r linux-x64 --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o build/godot
          build/godot/luma --help

      - name: UI smoke test (exported build)
        run: tools/smoke/run-ui-smoke.sh build/godot/Luma.x86_64 "${{ runner.temp }}/shots"

      - name: UI smoke test, desktop layout (exported build, 1920x1080)
        run: SMOKE_DESKTOP=1 tools/smoke/run-ui-smoke.sh build/godot/Luma.x86_64 "${{ runner.temp }}/shots-desktop"

      - name: Export Windows build
        working-directory: src/Luma.App
        run: |
          mkdir -p ../../build/godot-windows
          timeout 600 "$GODOT" --headless --export-release Windows ../../build/godot-windows/Luma.exe 2>&1 | tee export-windows.log
          test -f ../../build/godot-windows/Luma.exe
          test -d ../../build/godot-windows/data_Luma.App_windows_x86_64
          ! grep -E "^ERROR" export-windows.log

      - name: Headless CLI for Windows (luma-cli.exe)
        run: |
          dotnet publish src/Luma.Cli -c Release -r win-x64 --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o build/godot-windows
          test -f build/godot-windows/luma-cli.exe
          tools/release/package-windows.sh build/godot-windows 0.0.0 dist-windows   # for the installer test on Windows

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

      - name: Upload desktop layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-desktop
          path: ${{ runner.temp }}/shots-desktop
          if-no-files-found: ignore

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: Luma-linux-x86_64
          path: build/godot

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Luma-windows-x86_64
          path: build/godot-windows

      - name: Upload Windows package (CI test copy)
        uses: actions/upload-artifact@v4
        with:
          name: Luma-windows-zip-test
          path: dist-windows/Luma-windows-x86_64.zip

  windows:
    # The same code on a real Windows machine: tests (registry, known folders, job objects),
    # the exported build starting headless, the CLI, and the installer script.
    name: Windows (tests, exported build, installer)
    needs: [app]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build (warnings are errors)
        run: dotnet build Luma.sln -c Release
      - name: Test
        run: dotnet test Luma.sln -c Release --no-build --logger "console;verbosity=normal"
      - uses: actions/download-artifact@v4
        with:
          name: Luma-windows-x86_64
          path: build/godot-windows
      - uses: actions/download-artifact@v4
        with:
          name: Luma-windows-zip-test
          path: dist
      - name: CLI runs
        shell: pwsh
        run: |
          $cli = "build/godot-windows/luma-cli.exe"
          & $cli version; if ($LASTEXITCODE) { exit 1 }
          & $cli games;   if ($LASTEXITCODE) { exit 1 }
          & $cli games --all | Select-Object -Last 1
      - name: Exported app starts (headless)
        shell: pwsh
        run: |
          $p = Start-Process build/godot-windows/Luma.exe -ArgumentList '--headless','--quit-after','600' -PassThru -Wait `
            -RedirectStandardOutput app-out.log -RedirectStandardError app-err.log
          Get-Content app-out.log, app-err.log
          $log = Join-Path $env:LOCALAPPDATA 'Luma\logs\app.log'
          if (Test-Path $log) { Get-Content $log }
          if (Select-String -Path app-out.log, app-err.log -Pattern 'Unhandled exception|System\.[A-Za-z.]*Exception') { throw 'exceptions while starting' }
          if ($p.ExitCode -ne 0) { throw "exit code $($p.ExitCode)" }
      - name: Installer
        shell: pwsh
        run: |
          Expand-Archive dist/Luma-windows-x86_64.zip -DestinationPath $env:RUNNER_TEMP/unzipped
          $dest = Join-Path $env:RUNNER_TEMP 'Programs\Luma'
          & "$env:RUNNER_TEMP/unzipped/Luma/install.ps1" -Dest $dest -NoSteam
          if (-not (Test-Path "$dest/Luma.exe")) { throw 'not installed' }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'Luma.lnk'))) { throw 'no Start menu entry' }
          (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Luma').DisplayVersion
          & "$dest/uninstall.ps1" -Quiet
          Start-Sleep -Seconds 5
          if (Test-Path "$dest/Luma.exe") { throw 'not uninstalled' }

  release:
    # Every push to main whose version (Directory.Build.props) has no release yet publishes one:
    # the tarball and checksums the in-app updater reads, with that version's changelog as notes.
    name: Publish release
    needs: [dotnet, app, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          v=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.exists == 'false'
        with:
          name: Luma-linux-x86_64
          path: build/godot
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.exists == 'false'
        with:
          name: Luma-windows-x86_64
          path: build/godot-windows
      - name: Package
        if: steps.v.outputs.exists == 'false'
        run: |
          chmod +x build/godot/Luma.x86_64 build/godot/luma
          tools/release/package.sh build/godot "${{ steps.v.outputs.version }}" dist
          tools/release/package-windows.sh build/godot-windows "${{ steps.v.outputs.version }}" dist
          grep -q "Luma-linux-x86_64.tar.gz" dist/SHA256SUMS && grep -q "Luma-windows-x86_64.zip" dist/SHA256SUMS
          # Release notes: this version's section of CHANGELOG.md.
          awk -v v="## ${{ steps.v.outputs.version }}" '$0==v{on=1;next} /^## /{on=0} on' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md
      - name: Publish
        if: steps.v.outputs.exists == 'false'
        run: |
          gh release create "v${{ steps.v.outputs.version }}" dist/Luma-linux-x86_64.tar.gz dist/Luma-windows-x86_64.zip dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "Luma ${{ steps.v.outputs.version }}" --notes-file dist/notes.md
        env:
          GH_TOKEN: ${{ github.token }}
